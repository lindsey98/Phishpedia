[project]
name = "phishpedia"
channels = ["conda-forge"]
platforms = ["osx-arm64", "linux-64", "win-64"]

[dependencies]
python = ">=3.8"
pip = "*"
setuptools = "*"
wheel = "*"
numpy = "1.23.0"
pyyaml = "*"
pillow = "8.4.0"
tqdm = "*"
tldextract = "*"
gdown = "*"
fvcore = "*"

[pypi-dependencies]
flask = "*"
flask-cors = "*"
pycocotools = "*"
opencv-python = "*"
torch = { version = ">=1.9.0", index = "https://download.pytorch.org/whl/cpu" }
torchvision = { version = ">=0.10.0", index = "https://download.pytorch.org/whl/cpu" }
