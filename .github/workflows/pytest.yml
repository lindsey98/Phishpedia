name: Pytest CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out source repository
        uses: actions/checkout@v4

      - name: Set up Pixi environment
        uses: prefix-dev/setup-pixi@v0.8.1
        with:
          cache: true

      - name: Install pytest
        run: pixi run pip install pytest

      # The unit tests cover the pure helper functions only, so they run
      # without downloading the model weights or the target list.
      - name: Run unit tests
        run: pixi run pytest tests/ -v
